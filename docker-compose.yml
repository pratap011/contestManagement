services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blr_navigator
      POSTGRES_USER: blr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blr -d blr_navigator"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_URL: postgres://blr:${POSTGRES_PASSWORD}@db:5432/blr_navigator
      DATABASE_SSL: "false"
      COOKIE_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8787}
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
