databases:
  - name: blr-navigator-db
    plan: free
    databaseName: blr_navigator
    user: blr

services:
  - type: web
    name: blr-navigator
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: blr-navigator-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      # Optional: another same-site page origin allowed by the API. Keep the
      # web app and API on the same origin; no CORS is configured.
      - key: APP_ORIGIN
        sync: false
      # Optional: AeroDataBox covers future dates and the other bundled
      # airports. Free plan is non-commercial with attribution. Set the gateway
      # to match the key source (rapidapi or direct).
      - key: AERODATABOX_API_KEY
        sync: false
      - key: AERODATABOX_GATEWAY
        sync: false
      # Stable Web Push keys. Generate once and keep them secret; without these
      # the service creates ephemeral keys that break subscriptions on redeploy.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Optional OpenSky account for a higher ADS-B allowance.
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
